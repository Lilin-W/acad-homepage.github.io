<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eee6d7">
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
    <meta name="description" content="A little room for Lana Del Rey, favorite records, and memories in soft focus. Pick a record and stay awhile.">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/lana-room/lana.css' | relative_url }}">
    <script type="module" src="{{ '/assets/lana-room/lana.js' | relative_url }}"></script>
    <noscript><style>.room-loading,.light-switch,.room-caption,.record-console,.record-status,.collection-heading,.playback-note,#load-video{display:none!important}.room-fallback[hidden]{display:flex!important}</style></noscript>
  </head>
  <body data-baseurl="{{ site.baseurl | escape }}">
    <a class="skip-link" href="#record-controls">Skip to record controls</a>
    {{ content }}
  </body>
</html>
