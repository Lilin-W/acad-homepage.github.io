<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小满 · 回忆旋转灯 3D</title><link rel="stylesheet" href="style.css?v=scallop-detail-1"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module" src="scene.js?v=gentle-drag-inertia-20260919"></script></head><body>
<header><a href="../../xiaoman/" class="back">← 小满的主页</a><span class="brand">XIAOMAN <i>·</i> MEMORY ATELIER</span><button id="lighting" aria-pressed="false">☾ 夜晚</button></header>
<main><div class="intro"><p class="kicker">A LITTLE LIGHT, A LOT OF LOVE</p><h1>小满的回忆旋转灯</h1><p class="subtitle">让那些舍不得的小瞬间，慢慢转，轻轻亮。</p></div>
<div id="stage" aria-label="3D 木马相片灯，拖动查看不同角度" tabindex="0"><p id="loading">正在点亮小满的回忆…</p></div>
<div class="scene-note"><span>01 — THE MEMORY CAROUSEL</span><span>拖动环看 · 滚轮 / 双指缩放</span></div>
<div class="view-controls" aria-label="视角控制"><button id="zoom-in" aria-label="拉近">＋</button><button id="zoom-out" aria-label="拉远">－</button><button id="reset-view">↺ 复位</button></div><nav><button id="rotation" aria-pressed="true">Ⅱ 暂停旋转</button><button id="wind" aria-pressed="false">〰 起风了</button><button id="upload" class="primary">＋ 挂上照片</button><input id="files" type="file" accept="image/jpeg,image/png,image/webp" hidden></nav>
<p class="interaction-copy">挂一张照片，留住一个小瞬间。</p><p class="interaction-help">点击相片放大 · 拖动环看 · 起风，让回忆轻轻摇晃</p><p id="status" role="status" aria-live="polite"></p>
<details><summary>展开相片目录</summary><div id="photo-list"></div></details>
</main><dialog id="viewer" aria-labelledby="photo-title"><button id="close" aria-label="关闭照片">×</button><img id="full-photo" alt=""><h2 id="photo-title"></h2><button id="swap-photo">交换位置</button><button id="edit-photo">调整 / 更换</button><button id="remove" hidden>取下这张照片</button></dialog>
<dialog id="slots" aria-labelledby="slots-title"><button class="dialog-close" data-close="slots" aria-label="关闭位置选择">×</button><h2 id="slots-title">给照片选个位置</h2><p>16 个位置，把喜欢的瞬间挂起来。</p><div id="slot-grid"></div></dialog>
<dialog id="editor" aria-labelledby="editor-title"><button class="dialog-close" data-close="editor" aria-label="关闭照片编辑">×</button><h2 id="editor-title">挂上照片</h2><div class="editor-layout"><canvas id="crop-preview" width="464" height="584" aria-label="照片裁剪预览"></canvas><div class="editor-controls"><button id="choose-file">选择一张照片</button><p>JPG、PNG、WebP · 最大 20 MB</p><label>照片下方文字<input id="caption" type="text" maxlength="32" placeholder="给这一刻写几个字"></label><label>放大画面<input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1"></label><label>左右位置<input id="crop-x" type="range" min="0" max="1" step="0.01" value="0.5"></label><label>上下位置<input id="crop-y" type="range" min="0" max="1" step="0.01" value="0.5"></label><button id="reset-crop">↺ 重置裁剪</button></div></div><p id="editor-status" role="status"></p><button id="save-photo" class="primary" disabled>确认挂上</button></dialog>
</body></html>
